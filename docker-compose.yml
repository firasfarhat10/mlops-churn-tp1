# Deux services : le serveur MLflow et notre API
services:

  # ----- Service 1 : le serveur MLflow (tracking + Registry) -----
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.1
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts "mlflow:5000,localhost:5000,127.0.0.1:5000"
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow

  # ----- Service 2 : notre API -----
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: models:/churn-model@champion
    depends_on:
      - mlflow
    restart: on-failure

# Déclaration du volume nommé utilisé par mlflow
volumes:
  mlflow-data:



